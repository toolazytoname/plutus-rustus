[package]
name = "plutus-rustus"
version = "0.2.3"
authors = ["a137x"]
edition = "2021"
default-run = "plutus-rustus"

[dependencies]
rand = "0.8.5"
bitcoin = "0.30.1"
serde-pickle = "1.1.1"
num_cpus = "1.16.0"
sha2 = "0.10"
ripemd = "0.1.3"
reqwest = { version = "=0.11.27", default-features = false, features = ["blocking", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
ctrlc = "3"
flate2 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
